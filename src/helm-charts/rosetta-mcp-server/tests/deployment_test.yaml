suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: creates a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: sets replicas from replicaCount
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: uses the configured image
    set:
      image.repository: my-registry/my-app
      image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "my-registry/my-app:1.2.3"

  - it: defaults image tag to Chart.appVersion when tag is not set
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^griddynamics/rosetta-mcp:.+"

  - it: applies pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: applies container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: sets resource requests and limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: configures rolling update strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  - it: renders liveness and readiness probes
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: probes target port8000 by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: port8000
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: port8000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: port8000

  - it: probes follow the first entry of ports when overridden
    set:
      ports:
        - 9000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: port9000
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: port9000
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: port9000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: port9000

  - it: explicit probe port wins over derived port
    set:
      ports:
        - 9000
      readinessProbe:
        httpGet:
          port: custom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: custom
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: port9000

  - it: sets ROSETTA_HTTP_PORT from the first entry of ports by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROSETTA_HTTP_PORT
            value: "8000"
          count: 1

  - it: sets ROSETTA_HTTP_PORT from ports when overridden
    set:
      ports:
        - 9000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROSETTA_HTTP_PORT
            value: "9000"
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROSETTA_HTTP_PORT
            value: "8000"

  - it: keeps an explicit ROSETTA_HTTP_PORT from env.vars and renders it once
    set:
      ports:
        - 9000
      env.vars:
        - name: ROSETTA_HTTP_PORT
          value: "8123"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROSETTA_HTTP_PORT
            value: "8123"
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROSETTA_HTTP_PORT
            value: "9000"
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2
