[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ims-mcp"
version = "3.0.3"
description = "Backward-compatibility alias for rosetta-mcp. Installs rosetta-mcp and exposes the legacy `ims-mcp` command; use rosetta-mcp directly for new setups."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Rosetta Team", email = "rosetta-support@griddynamics.com"}
]
keywords = ["mcp", "rosetta", "ims", "retrieval", "rag", "ai", "llm", "model-context-protocol", "knowledge-base"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "rosetta-mcp==3.0.3",
]

[project.urls]
Homepage = "https://github.com/griddynamics/rosetta"
Website = "https://griddynamics.github.io/rosetta/"
Support = "https://github.com/griddynamics/rosetta/issues"

[project.scripts]
ims-mcp = "rosetta_mcp.server:main"
