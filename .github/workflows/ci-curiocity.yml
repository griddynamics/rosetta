name: CI Curiocity

# Pre-merge gate: lint + build + tests for the curiocity package on every PR
# that touches it. Complements publish-curiocity.yml, which only runs on push
# to main (publish time) and is not a pre-merge gate. Mirrors that workflow's
# validate/build/test steps so a green CI here means the publish job will pass.
on:
  pull_request:
    paths:
      - 'src/curiocity/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    # A release pipeline publishes on push to main for these same paths. Fail the
    # PR when the version it would publish already exists, so the bump ships here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Read version
      id: version
      run: echo "version=$(jq -r '.version // empty' src/curiocity/package.json)" >> "$GITHUB_OUTPUT"

    - name: Fail if curiocity version is already published
      uses: ./.github/actions/version-unpublished
      with:
        registry: npm
        package: curiocity
        version: ${{ steps.version.outputs.version }}
        version-file: src/curiocity/package.json

  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: src/curiocity/package-lock.json

    - name: Install dependencies
      working-directory: ./src/curiocity
      run: npm ci

    - name: Run type validation
      working-directory: ./src/curiocity
      run: npm run lint

    - name: Build package
      working-directory: ./src/curiocity
      run: npm run build

    - name: Run tests
      working-directory: ./src/curiocity
      run: npm run test
