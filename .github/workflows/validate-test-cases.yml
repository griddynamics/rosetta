# Validate Test Cases
#
# Trigger: manual (workflow_dispatch) for now. The automatic pull_request trigger
# on instructions/ changes is disabled on purpose for CI budget; see the `on:` block.
# The pull_request-only steps (base-SHA diff, PR comment) are kept intentionally
# for when that trigger is restored.
#
# For each test-library/* case whose trigger.txt matches changed files:
# - Copies root to root-new and root-old
# - Injects instructions (new vs old) into each
# - Runs prompt-request on both workspaces
# - Runs prompt-validation (subagent) to compare results
#
# Runs on EITHER agent -- see docs/AUTOMATION-ARCHITECTURE.md, "Agent switch".
# Codex is the default; pick per run with the `agent` input, or repo-wide with the
# `ROSETTA_CI_AGENT` repository variable. The workflow installs only the selected
# CLI; run-test-cases.sh renders the per-agent invocation.
#
# Required: the selected agent's CLI (`claude` or `codex`), installed below.
# VALIDATE_CLI_CMD still overrides the command name for either branch.
#
# Optional: BIFROST_API_KEY + BIFROST_HOST_NAME routes both branches via Bifrost
# (`/anthropic` for Claude, `/openai/v1` for Codex); otherwise each CLI's own auth.

name: Validate Test Cases

on:
  # The pull_request trigger below is disabled on purpose and temporarily:
  # each run makes 3 Claude CLI calls per matched test-library case, which costs
  # more per PR than the current CI budget allows. It is not broken. Run it by
  # hand via workflow_dispatch until the budget is restored.
#  pull_request:
#    types: [opened, synchronize, reopened, ready_for_review]
#    paths:
#      - 'instructions/r3/**'
#      - '.github/workflows/validate-test-cases.yml'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Coding agent to run'
        type: choice
        options:
          - codex
          - claude
        default: codex

permissions:
  contents: read
  pull-requests: write  # for PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-cases:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # Safety net only: the job runs 3 Claude CLI calls per matched test-library case
    # (prompt-request on root-old + root-new, then prompt-validation), so raise this
    # if a change fans out to many cases.
    timeout-minutes: 180
    env:
      # The agent switch. A dispatch input wins; otherwise the repository variable
      # ROSETTA_CI_AGENT; otherwise codex. run-test-cases.sh reads the same variable.
      ROSETTA_AGENT: ${{ inputs.agent || vars.ROSETTA_CI_AGENT || 'codex' }}
      PR_COMMENT_FILE: .tmp/pr-comment.md
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Install Claude Code CLI
        if: env.ROSETTA_AGENT == 'claude'
        run: |
          echo "Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Codex CLI
        if: env.ROSETTA_AGENT == 'codex'
        run: |
          echo "Installing Codex CLI..."
          npm install -g @openai/codex
          codex --version

      - name: Get changed files in instructions folder
        id: changed
        run: |
          echo "Detecting changed files in instructions/ folder..."

          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            git fetch origin "$BASE_BRANCH"
            BASE_REF="origin/$BASE_BRANCH"
          else
            BASE_REF="HEAD^"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD -- 'instructions/**/*.md' 2>/dev/null | tr '\n' ' ' || true)

          echo "Changed files: $CHANGED_FILES"
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          if [ -z "$CHANGED_FILES" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
          else
            COUNT=$(echo "$CHANGED_FILES" | wc -w | tr -d ' ')
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      # Kept for the pull_request trigger (disabled, see `on:`); manual runs use HEAD^.
      - name: Set base SHA
        id: base
        if: steps.changed.outputs.count > 0
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            git fetch origin "$BASE_BRANCH"
            echo "sha=$(git rev-parse origin/$BASE_BRANCH)" >> $GITHUB_OUTPUT
          else
            echo "sha=$(git rev-parse HEAD^)" >> $GITHUB_OUTPUT
          fi

      - name: Run test case validation
        id: validate
        if: steps.changed.outputs.count > 0
        env:
          # Both credential sets are exported; each CLI reads only its own pair, and
          # run-test-cases.sh invokes exactly one of them.
          ANTHROPIC_API_KEY: ${{ secrets.BIFROST_API_KEY }}
          ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
          # The raw Codex CLI honours OPENAI_BASE_URL/OPENAI_API_KEY directly -- unlike
          # openai/codex-action, which routes through its own Responses API proxy. The
          # base URL therefore stops at /openai/v1; Codex appends the endpoint path.
          OPENAI_API_KEY: ${{ secrets.BIFROST_API_KEY }}
          OPENAI_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/openai/v1
          ENABLE_TOOL_SEARCH: "true"
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          REPO_ROOT: ${{ github.workspace }}
          INSTRUCTIONS_NEW: ${{ github.workspace }}/instructions
          PR_COMMENT_FILE: ${{ github.workspace }}/.tmp/pr-comment.md
        run: |
          echo "Running test cases for changed prompts..."
          chmod +x .github/scripts/run-test-cases.sh
          .github/scripts/run-test-cases.sh

      # pull_request-only; kept for when the trigger is restored (see `on:`).
      - name: Generate PR comment
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COMMENT_FILE: ${{ github.workspace }}/.tmp/pr-comment.md
        run: |
          echo "Posting PR comment..."
          [ -f "$PR_COMMENT_FILE" ] || exit 0
           
          # Use gh CLI to create PR comment
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file "$PR_COMMENT_FILE"

          echo "::notice::PR comment posted"

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Prompt Validation Summary

          - **Files validated:** ${{ steps.changed.outputs.count }}
          - **Status:** $( [ "${{ steps.validate.outputs.status }}" = "failed" ] && echo ":x: Failed" || echo ":white_check_mark: Passed" )
          EOF
