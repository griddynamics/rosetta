name: Rosetta Repo Analysis

# Reviews the codebase for improvements and files them as GitHub issues on the
# "Rosetta Automation Board" (GitHub Projects v2, org griddynamics, project
# number 57 — https://github.com/orgs/griddynamics/projects/57), added at
# Status "Backlog". Board membership is the scoping mechanism (replaces the
# old Jira epic parent).
#
# Required GitHub Secrets:
#   - BIFROST_HOST_NAME: Bifrost gateway hostname (no protocol/port/path), routes Anthropic API calls through Bifrost
#   - BIFROST_API_KEY: Bifrost-issued API key
#   - SELF_AUTOMATION_PROJECTS_TOKEN: PAT with org Projects (read/write) plus repo
#     Issues/Pull requests/Contents (read/write) scope.
#     The default GITHUB_TOKEN cannot read or write GitHub Projects v2 items,
#     so this PAT is used for all gh operations in this workflow.

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          token: ${{ github.token }}

      # Removes `run_in_background` from the Agent tool schema, so subagents cannot
      # be backgrounded. A backgrounded subagent's report is delivered on a later
      # turn, which a one-shot headless run never has: the report is lost and the
      # job exits reporting success. Written via $GITHUB_ENV because the action's
      # own step `env:` block shadows job-level env vars.
      - name: Force synchronous subagents
        run: echo "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1" >> "$GITHUB_ENV"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.BIFROST_API_KEY }}
          github_token: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: |
            https://github.com/griddynamics/rosetta.git
          plugins: |
            rosetta@rosetta
          prompt: "MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-analysis.md"
          show_full_output: false
          claude_args: >-
            --allowedTools
            "Read,Glob,Grep,Agent,Bash(gh * list*),Bash(gh * status*),Bash(gh repo view*),Bash(gh issue view*),Bash(gh issue create*),Bash(gh issue edit*),Bash(gh issue close*),Bash(gh issue comment*),Bash(gh pr view*),Bash(gh project view*),Bash(gh project field-list*),Bash(gh project item-list*),Bash(gh project item-add*),Bash(gh project item-edit*),Bash(gh api graphql*),Bash(gh api repos/*/tags*),Bash(gh api repos/*/contents/*),Bash(gh api repos/*/git/trees/*),Bash(gh api repos/*/code-scanning/alerts*),Bash(gh api repos/*/code-scanning/analyses*),Bash(gh api repos/*/dependabot/alerts*),Bash(gh api repos/*/commits/*/check-runs*)"
            --model sonnet
            --effort medium
            --disallowedTools
            "ScheduleWakeup,Bash(* --show-token),Bash(* --show-token*)"

      # The trace is a full tool transcript published as a downloadable artifact,
      # outside Actions log masking. Redact credentials before it leaves the runner.
      - name: Scrub credentials from execution trace
        if: always()
        env:
          SCRUB_VALUES: |
            ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
            ${{ secrets.BIFROST_API_KEY }}
        run: python3 .github/scripts/scrub_trace.py /home/runner/work/_temp/claude-execution-output.json

      - name: Upload Claude execution trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-trace
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 3

      # claude-code-action decides success from `subtype`/`is_error` alone, so a run
      # that abandons its subagents and files nothing is indistinguishable from a
      # clean one. This inspects the trace and fails the job instead.
      - name: Verify the run did real work
        if: always()
        run: python3 .github/scripts/check_trace.py /home/runner/work/_temp/claude-execution-output.json
