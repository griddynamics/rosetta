name: CI Rosetta MCP

# Pre-merge gate: build + tests for the rosetta-mcp-server package on every PR
# that touches it. Complements publish-rosetta-mcp.yml, which only runs on push
# to main (publish time) and is not a pre-merge gate. Mirrors that workflow's
# build/test steps so a green CI here means the publish job will pass.
on:
  pull_request:
    paths:
      - 'src/rosetta-mcp-server/**'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Create venv and install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install build twine
        echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: src/rosettify/package-lock.json

    - name: Install rosettify dependencies
      working-directory: ./src/rosettify
      run: npm ci

    - name: Run type validation
      run: |
        chmod +x src/validate-types.sh
        ./src/validate-types.sh

    - name: Build package
      working-directory: ./src/rosetta-mcp-server
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Check package
      working-directory: ./src/rosetta-mcp-server
      run: |
        twine check dist/*

    - name: Assert chart appVersion matches rosetta-mcp-server version
      run: |
        set -euo pipefail
        CHART_PATH=./src/helm-charts/rosetta-mcp-server
        SERVER_PYPROJECT=./src/rosetta-mcp-server/pyproject.toml
        APP_VERSION="$(grep -E '^appVersion:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
        SERVER_VERSION="$(grep -E '^version = ' "${SERVER_PYPROJECT}" | head -1 | sed 's/version = "\(.*\)"/\1/')"
        echo "Chart appVersion:           ${APP_VERSION}"
        echo "rosetta-mcp-server version: ${SERVER_VERSION}"
        if [ "${APP_VERSION}" != "${SERVER_VERSION}" ]; then
          echo "::error::Chart.yaml appVersion (${APP_VERSION}) does not match src/rosetta-mcp-server/pyproject.toml version (${SERVER_VERSION}). values.yaml defaults image.tag to .Chart.AppVersion, so a default install would pull the wrong image. Bump Chart.yaml appVersion (and the chart version) - scripts/bump_versions.sh does both."
          exit 1
        fi
        echo "appVersion is in sync."

    - name: Run tests
      working-directory: ./src/rosetta-mcp-server
      run: |
        pytest tests/ -v
