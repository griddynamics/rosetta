name: Validate Prompts

# This workflow validates prompt quality using the Prompt Quality Auditor agent
# when changes are made to the instructions/ folder in pull requests.
#
# Runs on EITHER agent -- see docs/AUTOMATION-ARCHITECTURE.md, "Agent switch".
# Codex is the default; pick per run with the `agent` input, or repo-wide with the
# `ROSETTA_CI_AGENT` repository variable.
#
# Required GitHub Secrets:
#   - BIFROST_HOST_NAME: Bifrost gateway hostname (no protocol/port/path). Routes
#     Anthropic API calls (Claude branch, `/anthropic`) and OpenAI Responses API
#     calls (Codex branch, `/openai/v1/responses`) through Bifrost.
#   - BIFROST_API_KEY: Bifrost-issued API key. Used by both branches.
#
# The workflow:
# - Detects changed files in instructions/ folder
# - Compares base (target branch) vs new (PR branch) versions
# - Runs the Prompt Quality Auditor agent on the selected agent
# - Outputs issues sorted by severity (critical first)
# - Blocks PR if HIGH+ issues found (severity >= 3: high, very high, critical)
# - Creates a PR comment with all issues by severity

on:
  # Re-enabled: the agent run costs more per PR than plain CI, so the `paths` filter
  # below is what keeps it affordable -- it fires only when the prompts themselves,
  # or this pipeline, change. Comment it out again if the budget tightens.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "instructions/r*/**"
      - ".github/workflows/validate-prompts.yml"
      - ".github/prompts/prompt-comparison.md"
  workflow_dispatch:
    inputs:
      agent:
        description: 'Coding agent to run'
        type: choice
        options:
          - codex
          - claude
        default: codex

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write # Required for creating PR comments

    env:
      # The agent switch. A dispatch input wins; otherwise the repository variable
      # ROSETTA_CI_AGENT; otherwise codex. Every agent-specific step below keys off
      # this one value, so the two branches can never both run.
      ROSETTA_AGENT: ${{ inputs.agent || vars.ROSETTA_CI_AGENT || 'codex' }}
      TMP_DIR: .tmp
      CODEX_PROMPT_FILE: .tmp/codex-prompt.md
      ALL_RESULTS_FILE: .tmp/all-results.json
      PR_COMMENT_FILE: .tmp/pr-comment.md
      FULL_REPORT_FILE: .tmp/full-report.md
      DIFF_FILE: .tmp/instructions.diff
      TARGET_PR_NUMBER: ${{ github.event.pull_request.number }}
      TARGET_BASE_REF: ${{ github.event.pull_request.base.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # Fetch all history to compare with base branch

      # Fork content lands in pr/ as data the auditor READS -- nothing here builds,
      # installs or executes from that tree, and the allowlist below grants only
      # Read(pr/**) plus read-only git subcommands over it. That is why opting out
      # of the checkout guardrail is safe; persist-credentials must stay off so the
      # base repo's GITHUB_TOKEN is never written into pr/.git/config, which
      # Read(pr/**) would otherwise expose. The base fetch below re-adds its own
      # unauthenticated remote, so nothing depends on the persisted credential.
      - name: Checkout PR content
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Install Bun
        if: env.ROSETTA_AGENT == 'claude'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          token: ${{ github.token }}

      # Codex has no `plugins:` input and no `--allowedTools`; both are arranged here.
      # Safe under pull_request_target because the base repo is checked out at `ref: main`
      # above, so this local action is trusted code, never the fork's.
      - name: Set up Codex
        if: env.ROSETTA_AGENT == 'codex'
        id: codex
        uses: ./.github/actions/codex-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files in instructions folder
        id: changed-files
        run: |
          echo "Detecting changed files in instructions/ folder..."

          if [ -n "$TARGET_BASE_REF" ]; then
            BASE_BRANCH="$TARGET_BASE_REF"
            git -C pr remote add base "https://github.com/$GITHUB_REPOSITORY.git"
            git -C pr fetch base "$BASE_BRANCH"
            BASE_REF="base/$BASE_BRANCH"
          else
            BASE_REF="HEAD^"
          fi

          echo "Base ref: $BASE_REF"

          # Get changed files in instructions/ folder
          CHANGED_FILES=$(git -C pr diff --name-only "$BASE_REF"...HEAD -- 'instructions/r*/**' 2>/dev/null | tr '\n' ' ' || true)

          echo "Changed files: $CHANGED_FILES"
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT

          # Count files
          if [ -z "$CHANGED_FILES" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
          else
            COUNT=$(echo "$CHANGED_FILES" | wc -w | tr -d ' ')
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Generate diff
        if: steps.changed-files.outputs.count > 0
        env:
          BASE_REF: ${{ steps.changed-files.outputs.base_ref }}
        run: |
          mkdir -p $TMP_DIR/agents
          git -C pr diff "$BASE_REF"...HEAD -- 'instructions/r*/**' > $DIFF_FILE 2>/dev/null || true
          echo "::notice::Diff generated: $(wc -l < $DIFF_FILE) lines"

      # allowed_non_write_users bypasses claude-code-action's own actor-permission
      # gate (see repo-triage.yml for the full rationale) -- without it, fork PR
      # authors would be newly blocked from triggering prompt validation, a
      # regression from today's raw-CLI invocation which has no such gate.
      #
      # Read/Write/Edit are scoped to absolute paths under github.workspace rather
      # than left bare, and Glob/Grep are not granted at all (unchanged from
      # before). The explicit /proc and /etc denies are a redundant second layer
      # for the same reason as repo-triage.yml: deny wins regardless of
      # specificity, so this holds even if the allow scope is ever loosened.
      - name: Validate prompts
        id: run-validation
        if: steps.changed-files.outputs.count > 0 && env.ROSETTA_AGENT == 'claude'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
          ENABLE_TOOL_SEARCH: "true"
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          allowed_non_write_users: "*"
          anthropic_api_key: ${{ secrets.BIFROST_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: |
            https://github.com/griddynamics/rosetta.git
          plugins: |
            rosetta@rosetta
          prompt: |
            Changed files: ${{ steps.changed-files.outputs.files }}
            Git base ref: ${{ steps.changed-files.outputs.base_ref }}
            Changed count: ${{ steps.changed-files.outputs.count }}
            Output file: ${{ env.ALL_RESULTS_FILE }}
            Diff file: ${{ env.DIFF_FILE }}
            PR content path: pr
          show_full_output: false
          claude_args: |
            --model
            opus
            --effort
            high
            --allowedTools
            "Write(/${{ github.workspace }}/.tmp/**),Edit(/${{ github.workspace }}/.tmp/**),Read(/${{ github.workspace }}/.tmp/**),Read(/${{ github.workspace }}/instructions/**),Read(/${{ github.workspace }}/docs/**),Read(/${{ github.workspace }}/agents/**),Read(/${{ github.workspace }}/pr/**),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git ls-files:*),Bash(git rev-parse:*),Task"
            --disallowedTools
            "Read(//proc/**),Read(//etc/**)"
            --system-prompt-file
            ./.github/prompts/prompt-comparison.md

      # Codex has no `--system-prompt-file`. The auditor persona and the run's
      # variables therefore go into ONE prompt file, in the same order the Claude
      # branch presents them (system prompt first, then the task).
      - name: Assemble Codex prompt
        if: steps.changed-files.outputs.count > 0 && env.ROSETTA_AGENT == 'codex'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          BASE_REF: ${{ steps.changed-files.outputs.base_ref }}
          CHANGED_COUNT: ${{ steps.changed-files.outputs.count }}
        run: |
          mkdir -p "$TMP_DIR"
          cat ./.github/prompts/prompt-comparison.md > "$CODEX_PROMPT_FILE"
          {
            printf '\n\n---\n\n'
            printf 'Changed files: %s\n' "$CHANGED_FILES"
            printf 'Git base ref: %s\n' "$BASE_REF"
            printf 'Changed count: %s\n' "$CHANGED_COUNT"
            printf 'Output file: %s\n' "$ALL_RESULTS_FILE"
            printf 'Diff file: %s\n' "$DIFF_FILE"
            printf 'PR content path: pr\n'
            printf '\n'
            printf 'Environment: `.agents/`, `.codex/`, and `.codex-plugin/` hold the Rosetta\n'
            printf 'instruction set -- tooling CI extracted into this workspace, not repository\n'
            printf 'content. Read those paths from the working tree (`cat`, `sed`); never through\n'
            printf 'git (`git show`, `git log`, `git diff`).\n'
          } >> "$CODEX_PROMPT_FILE"
          echo "::notice::Codex prompt assembled: $(wc -l < "$CODEX_PROMPT_FILE") lines"

      # Codex counterpart of the step above. `allow-users: "*"` matches
      # `allowed_non_write_users` on the Claude branch, for the same reason.
      #
      # `rosetta-workspace` is the no-network profile: this auditor only reads the
      # instruction trees and writes its JSON into .tmp/, and every GitHub call is made
      # by the workflow's own steps below, not by the agent. Reads of /proc and /etc are
      # denied, mirroring the Claude branch's disallowedTools. What has no counterpart is
      # the per-path Read/Write scoping: a Codex run can read and write anywhere in the
      # workspace, not just .tmp/ and the instruction folders.
      - name: Validate prompts (Codex)
        id: run-validation-codex
        if: steps.changed-files.outputs.count > 0 && env.ROSETTA_AGENT == 'codex'
      # Pinned to v1.11 deliberately. `@v1` resolves to v1.12, which introduced BOTH
      # of the failures seen here: #160 (drop-sudo chmods /run sockets to 0700, killing
      # systemd-resolved, so the runner loses DNS and dies 52-65 minutes in -- every
      # long Codex run in this repo did exactly that) and #150 (the Linux run never
      # returns after the turn completes). `restrictRootServiceSocket` is absent from
      # src/dropSudo.ts in v1.11 and earlier. Pinning keeps `safety-strategy` at its
      # secure `drop-sudo` default rather than trading the sudo revocation away.
      # Revisit when both are fixed upstream; v1.11 accepts every input used here.
        uses: openai/codex-action@v1.11
        with:
          allow-users: "*"
          allow-bots: "true"
          openai-api-key: ${{ secrets.BIFROST_API_KEY }}
          # Uncomment to pin the CLI if a floating `latest` ever regresses the beta
          # permission profiles (they need >= 0.138.0). This is the rollback lever.
          # codex-version: "0.142.2"
          responses-api-endpoint: https://${{ secrets.BIFROST_HOST_NAME }}/openai/v1/responses
          codex-home: ${{ steps.codex.outputs.codex-home }}
          permission-profile: rosetta-workspace
          # Mirrors the Claude branch's `--model opus --effort high`. The tier ladder is
          # the one instructions/r3/core/agents/*.md already pairs, position by position:
          # opus<->gpt-5.6-sol, sonnet<->gpt-5.6-terra, haiku<->gpt-5.6-luna. Effort is a
          # separate axis on Codex, so the `-high` suffix form collapses to model+effort.
          model: gpt-5.6-sol
          effort: high
          prompt-file: ${{ env.CODEX_PROMPT_FILE }}
          output-file: ${{ runner.temp }}/codex-final-message.md

      # `openai/codex-action` leaves its responses proxy and `codex exec` tree running
      # after the step reports success, and a runner cannot finalise a job while those
      # hold the step's output pipe. Every Codex run that did real work hung because of
      # it -- triage was cancelled at the job cap, analysis sat until GitHub declared
      # the runner lost at ~62 minutes. See .github/scripts/reap_agent_processes.sh.
      - name: Reap leftover agent processes
        if: always()
        run: .github/scripts/reap_agent_processes.sh

      # This pipeline was the only one of the five publishing no execution trace, so a
      # run could be audited for its REPORT but never for its BEHAVIOUR -- what the
      # agent actually ran, what the sandbox refused, whether it reached past its
      # brief. Green steps are not evidence of that. The trace is a full tool
      # transcript published outside Actions log masking, so credentials are redacted
      # before it leaves the runner.
      - name: Scrub credentials from execution trace
        if: always()
        env:
          SCRUB_VALUES: |
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.BIFROST_API_KEY }}
        run: |
          python3 .github/scripts/scrub_trace.py \
            /home/runner/work/_temp/claude-execution-output.json \
            "${{ steps.codex.outputs.sessions-dir }}"

      - name: Upload Claude execution trace
        if: always() && env.ROSETTA_AGENT == 'claude'
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-trace
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Codex execution trace
        if: always() && env.ROSETTA_AGENT == 'codex'
        uses: actions/upload-artifact@v6
        with:
          name: codex-execution-trace
          path: ${{ steps.codex.outputs.sessions-dir }}
          retention-days: 3
          if-no-files-found: warn

      - name: Check validation result
        id: validate
        if: steps.changed-files.outputs.count > 0
        run: |
          if [ ! -f "$ALL_RESULTS_FILE" ]; then
            echo "::warning::Output file not produced, creating empty result"
            echo '[]' > $ALL_RESULTS_FILE
          fi

          # Check for high severity issues
          HIGH_COUNT=$(jq '[.[] | .issues[]? | select(.severity >= 3)] | length' $ALL_RESULTS_FILE)
          echo "has_high_severity=$( [ "$HIGH_COUNT" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

          [ "$HIGH_COUNT" -gt 0 ] && echo "::error::Found $HIGH_COUNT high/very high/critical issues" && exit 1
          echo "::notice::No high/critical issues found"

      - name: Generate PR comment
        if: always() && env.TARGET_PR_NUMBER != '' && steps.changed-files.outputs.count > 0
        run: |
          REPORTABLE_RESULTS=$(jq '[.[] | select(.error or ((.issues // []) | length > 0))]' "$ALL_RESULTS_FILE")
          REPORTABLE_COUNT=$(echo "$REPORTABLE_RESULTS" | jq 'length')

          cat > "$FULL_REPORT_FILE" <<EOF
          ## Prompt Quality Validation Report

          $( [ "${{ steps.validate.outputs.has_high_severity }}" = "true" ] && echo "Validation failed: high-severity issues found." || echo "Validation completed without high-severity issues." )

          ### Changed Files

          EOF

          jq -c '.[]' "$ALL_RESULTS_FILE" | while read -r result; do
            FILE=$(echo "$result" | jq -r '.file')

            if echo "$result" | jq -e '.error' > /dev/null 2>&1; then
              echo "- \`$FILE\`: error" >> "$FULL_REPORT_FILE"
            else
              ISSUE_COUNT=$(echo "$result" | jq '(.issues // []) | length')
              if [ "$ISSUE_COUNT" -eq 0 ]; then
                echo "- \`$FILE\`: no issues" >> "$FULL_REPORT_FILE"
              else
                echo "- \`$FILE\`: $ISSUE_COUNT issue(s)" >> "$FULL_REPORT_FILE"
              fi
            fi
          done

          echo -e "\n---\n" >> "$FULL_REPORT_FILE"

          jq -c '.[]' "$ALL_RESULTS_FILE" | while read -r result; do
            FILE=$(echo "$result" | jq -r '.file')
            echo -e "### \`$FILE\`\n" >> "$FULL_REPORT_FILE"

            if echo "$result" | jq -e '.error' > /dev/null 2>&1; then
              echo "**Error:** $(echo "$result" | jq -r '.error')" >> "$FULL_REPORT_FILE"
              echo -e "\n---\n" >> "$FULL_REPORT_FILE"
              continue
            fi

            ISSUES=$(echo "$result" | jq '[.issues // [] | sort_by(.severity) | reverse[]]')

            if [ "$(echo "$ISSUES" | jq 'length')" -eq 0 ]; then
              echo "No issues found." >> "$FULL_REPORT_FILE"
              echo -e "\n---\n" >> "$FULL_REPORT_FILE"
              continue
            fi

            cat >> "$FULL_REPORT_FILE" <<EOF
          | Severity | Gate | Details |
          |----------|------|---------|
          EOF

            echo "$ISSUES" | jq -r '.[] | [
              (if .severity == 5 then "Critical"
               elif .severity == 4 then "Very High"
               elif .severity == 3 then "High"
               elif .severity == 2 then "Medium"
               elif .severity == 1 then "Low"
               else "Unknown" end),
              .gate, .problem, .reason, .solution] | @tsv' | \
            while IFS=$'\t' read -r sev gate prob reason sol; do
              echo "| $sev | $gate | **Problem:**<br> $prob<br>**Reason:**<br> $reason<br>**Solution:**<br> $sol |" >> "$FULL_REPORT_FILE"
            done

            echo "" >> "$FULL_REPORT_FILE"

            # Keep grades in the artifact report, but not in the PR comment.
            echo "$result" | jq -e '.gates' > /dev/null 2>&1 && {
              echo "#### Gates Comparison" >> "$FULL_REPORT_FILE"
              echo "" >> "$FULL_REPORT_FILE"
              echo "| Gate | Score | Comparison |" >> "$FULL_REPORT_FILE"
              echo "|------|-------|------------|" >> "$FULL_REPORT_FILE"

              echo "$result" | jq -r '.gates | to_entries | .[] |
                [.key,
                 .value.score,
                 (if .value.comparison == 5 then "Much better"
                  elif .value.comparison == 4 then "Slightly better"
                  elif .value.comparison == 3 then "No change"
                  elif .value.comparison == 2 then "Slightly worse"
                  elif .value.comparison == 1 then "Much worse"
                  else "Unknown" end)] | @tsv' | \
              while IFS=$'\t' read -r gate score change; do
                echo "| $gate | $score | $change |" >> "$FULL_REPORT_FILE"
              done
            }

            echo -e "\n---\n" >> "$FULL_REPORT_FILE"
          done

          cat > "$PR_COMMENT_FILE" <<EOF
          ## :clipboard: Prompt Quality Validation Report

          $( [ "${{ steps.validate.outputs.has_high_severity }}" = "true" ] && echo "### :x: Validation Failed" || echo "### :white_check_mark: Validation Passed" )

          The full markdown report and raw JSON output are available in the workflow artifacts for 5 days.
          EOF

          echo -e "\n---\n" >> "$PR_COMMENT_FILE"

          if [ "$REPORTABLE_COUNT" -eq 0 ]; then
            echo "No issues were found in the changed prompt files." >> "$PR_COMMENT_FILE"
          else
            echo "### Files With Issues" >> "$PR_COMMENT_FILE"
            echo "" >> "$PR_COMMENT_FILE"

            echo "$REPORTABLE_RESULTS" | jq -c '.[]' | while read -r result; do
              FILE=$(echo "$result" | jq -r '.file')

              if echo "$result" | jq -e '.error' > /dev/null 2>&1; then
                echo "- \`$FILE\`: error" >> "$PR_COMMENT_FILE"
              else
                ISSUE_COUNT=$(echo "$result" | jq '(.issues // []) | length')
                echo "- \`$FILE\`: $ISSUE_COUNT issue(s)" >> "$PR_COMMENT_FILE"
              fi
            done

            echo -e "\n---\n" >> "$PR_COMMENT_FILE"
          fi

          # Process only files with detailed issues or errors
          echo "$REPORTABLE_RESULTS" | jq -c '.[]' | while read -r result; do
            FILE=$(echo "$result" | jq -r '.file')

            # Show file name first
            echo -e "### :page_facing_up: \`$FILE\`\n" >> "$PR_COMMENT_FILE"

            if echo "$result" | jq -e '.error' > /dev/null 2>&1; then
              echo "**Error:** $(echo "$result" | jq -r '.error')" >> "$PR_COMMENT_FILE"
              echo -e "\n---\n" >> "$PR_COMMENT_FILE"
              continue
            fi

            # Show issues
            ISSUES=$(echo "$result" | jq '[.issues // [] | sort_by(.severity) | reverse[]]')

            echo "#### :warning: Issues Found" >> "$PR_COMMENT_FILE"
            echo "" >> "$PR_COMMENT_FILE"
            cat >> "$PR_COMMENT_FILE" <<EOF
          | Severity | Gate | Details |
          |----------|------|---------|
          EOF

            echo "$ISSUES" | jq -r '.[] | [
              (if .severity == 5 then "Critical"
               elif .severity == 4 then "Very High"
               elif .severity == 3 then "High"
               elif .severity == 2 then "Medium"
               elif .severity == 1 then "Low"
               else "Unknown" end),
              .gate, .problem, .reason, .solution] | @tsv' | \
            while IFS=$'\t' read -r sev gate prob reason sol; do
              echo "| $sev | $gate | **Problem:**<br> $prob<br>**Reason:**<br> $reason<br>**Solution:**<br> $sol |" >> "$PR_COMMENT_FILE"
            done
            echo "" >> "$PR_COMMENT_FILE"

            echo -e "\n---\n" >> "$PR_COMMENT_FILE"
          done

      - name: Upload prompt validation artifacts
        if: always() && steps.changed-files.outputs.count > 0
        uses: actions/upload-artifact@v6
        with:
          name: prompt-validation-report
          retention-days: 5
          if-no-files-found: error
          path: |
            .tmp/full-report.md
            .tmp/all-results.json

      - name: Delete old prompt validation comments
        if: always() && env.TARGET_PR_NUMBER != '' && steps.changed-files.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old prompt validation comments..."

          gh api "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR_NUMBER/comments" --paginate | \
            jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Prompt Quality Validation Report"))) | .id' | \
            while read -r comment_id; do
              [ -n "$comment_id" ] || continue
              echo "Deleting comment $comment_id"
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X DELETE
            done

      - name: Post PR comment
        if: always() && env.TARGET_PR_NUMBER != '' && steps.changed-files.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting PR comment..."

          # Use gh CLI to create PR comment
          gh pr comment "$TARGET_PR_NUMBER" \
            --body-file $PR_COMMENT_FILE

          echo "::notice::PR comment posted"

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Prompt Validation Summary

          - **Files validated:** ${{ steps.changed-files.outputs.count }}
          - **Status:** $( [ "${{ steps.validate.outputs.has_high_severity }}" = "true" ] && echo ":x: Failed" || echo ":white_check_mark: Passed" )
          EOF
