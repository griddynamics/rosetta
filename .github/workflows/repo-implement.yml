name: Rosetta Story Implementer

# DISABLED: triggers are workflow_dispatch-only until a manual test run is
# reviewed and the schedule is deliberately re-enabled.
#
# Reads open work items from the "Rosetta Automation Board" (GitHub Projects
# v2, org griddynamics, project number 57 — https://github.com/orgs/griddynamics/projects/57).
# Board membership is the scoping mechanism (replaces the old Jira epic parent):
# only issues added to that project are eligible for AI implementation.
#
# Status field flow on the board (see docs/AUTOMATION-ARCHITECTURE.md):
#   Scheduled -> In progress -> In review
#   Loads "Scheduled" (no priority filter — the user moving a card there is the
#   decision to build it). The workflow claims the card into "In progress" before
#   invoking the agent; the agent implements, opens a PR referencing the issue, and
#   moves the card to "In review" for the user to review.
#
# Required GitHub Secrets:
#   - BIFROST_HOST_NAME: Bifrost gateway hostname (no protocol/port/path), routes Anthropic API calls through Bifrost
#   - BIFROST_API_KEY: Bifrost-issued API key
#   - SELF_AUTOMATION_PROJECTS_TOKEN: PAT with org Projects (read/write) plus repo
#     Issues/Pull requests/Contents (read/write) scope. The default GITHUB_TOKEN
#     cannot read or write GitHub Projects v2 items, so this PAT is used for all
#     gh/git operations in this workflow.

on:
  schedule:
    - cron: '30 */3 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # ── Orchestrator ─────────────────────────────────────────────────────────────
  load-stories:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.impl_matrix }}
      has_work: ${{ steps.load.outputs.has_impl }}
      count: ${{ steps.load.outputs.impl_count }}
      project_id: ${{ steps.load.outputs.project_id }}
      status_field_id: ${{ steps.load.outputs.status_field_id }}
      status_option_ids: ${{ steps.load.outputs.status_option_ids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load board items
        id: load
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
        run: python .github/scripts/load_stories.py

      - name: Summary
        run: |
          echo "## Implementer — Board Load" >> $GITHUB_STEP_SUMMARY
          echo "- Issues to implement: ${{ steps.load.outputs.impl_count }}" >> $GITHUB_STEP_SUMMARY

  # ── Implementation subagents (parallel, one per issue) ────────────────────────
  implement-story:
    needs: load-stories
    if: needs.load-stories.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

    strategy:
      matrix: ${{ fromJSON(needs.load-stories.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The push credential is set explicitly in "Configure git" below; without
          # this, checkout also leaves a GITHUB_TOKEN in .git/config and which of the
          # two authenticates a push is undefined.
          persist-credentials: false

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}@github.com/${{ github.repository }}

      # An auto-triggered run can fire while the issue is still being edited. Wait until
      # it has been quiet for 5 minutes before claiming it, so the agent never implements
      # a half-written plan. Manual dispatch skips this — the user chose the moment.
      # (This is the runner's own shell; the agent-side sleep restrictions do not apply.)
      - name: Debounce — wait for the issue to settle
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ISSUE: ${{ matrix.issue_number }}
        run: |
          previous=""
          for attempt in $(seq 1 6); do
            current=$(gh issue view "$ISSUE" --json updatedAt -q .updatedAt)
            if [ "$current" = "$previous" ]; then
              echo "Issue #$ISSUE unchanged for 5 minutes (last update $current) — proceeding."
              exit 0
            fi
            echo "Issue #$ISSUE updated at $current — waiting 5 minutes (attempt $attempt/6)."
            previous="$current"
            sleep 300
          done
          echo "::warning::Issue #$ISSUE still changing after 30 minutes — proceeding anyway."

      # Claiming needs no judgement, so it is done here rather than costing an agent
      # turn. jq -e fails the step if the board has no "In progress" option, instead
      # of letting the agent run against a lane that does not exist.
      - name: Claim — move card to In progress
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ITEM_ID: ${{ matrix.item_id }}
          ISSUE: ${{ matrix.issue_number }}
          PROJECT_ID: ${{ needs.load-stories.outputs.project_id }}
          FIELD_ID: ${{ needs.load-stories.outputs.status_field_id }}
          OPTION_IDS: ${{ needs.load-stories.outputs.status_option_ids }}
        run: |
          option_id=$(printf '%s' "$OPTION_IDS" | jq -er '."In progress"')
          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_ID" --single-select-option-id "$option_id"
          gh issue comment "$ISSUE" --body "🤖 Implementation started by AI agent."

      - name: Implement — issue #${{ matrix.issue_number }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.BIFROST_API_KEY }}
          github_token: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: |
            https://github.com/griddynamics/rosetta.git
          plugins: |
            rosetta@rosetta
          prompt: |
            Issue: #${{ matrix.issue_number }} — ${{ matrix.issue_title }}
            Project item ID: ${{ matrix.item_id }}
            Project ID: ${{ needs.load-stories.outputs.project_id }}
            Status field ID: ${{ needs.load-stories.outputs.status_field_id }}
            Status option IDs (JSON, name -> id): ${{ needs.load-stories.outputs.status_option_ids }}

            MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-implement-code.md
          show_full_output: false
          claude_args: |
            --allowedTools
            "Read,Write,Edit,MultiEdit,Glob,Grep,Agent,Skill,Bash(*)"
            --disallowedTools ScheduleWakeup
            --model sonnet
            --effort medium

      # The trace is a full tool transcript published as a downloadable artifact,
      # outside Actions log masking. Redact credentials before it leaves the runner.
      - name: Scrub credentials from execution trace
        if: always()
        env:
          SCRUB_VALUES: |
            ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
            ${{ secrets.BIFROST_API_KEY }}
        run: python3 .github/scripts/scrub_trace.py /home/runner/work/_temp/claude-execution-output.json

      - name: Upload Claude execution trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-trace-${{ matrix.issue_number }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 3

      # claude-code-action decides success from `subtype`/`is_error` alone, so a run
      # that abandons its subagents and changes nothing is indistinguishable from a
      # clean one. This inspects the trace and fails the job instead.
      - name: Verify the run did real work
        if: always()
        run: python3 .github/scripts/check_trace.py /home/runner/work/_temp/claude-execution-output.json

      # The card stays in the In progress lane, which no pipeline loads, so a failed
      # run waits for a human instead of being retried. Say so on the issue.
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ISSUE: ${{ matrix.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ Implementation run failed — see [the run log]($RUN_URL).

          The card is left at \`In progress\`, which no pipeline picks up, so it will not be retried automatically. Move it back to \`Scheduled\` to retry, or to \`Backlog\` to re-plan first."
