name: Rosetta Story Implementer

# Reads open work items from the "Rosetta Automation Board" (GitHub Projects
# v2, org griddynamics, project number 57 — https://github.com/orgs/griddynamics/projects/57).
# Board membership is the scoping mechanism (replaces the old Jira epic parent):
# only issues added to that project are eligible for AI implementation.
#
# Status field flow on the board (see docs/AUTOMATION-ARCHITECTURE.md):
#   Scheduled -> In progress -> In review
#   Loads "Scheduled" (no priority filter — the user moving a card there is the
#   decision to build it). The workflow claims the card into "In progress" before
#   invoking the agent; the agent implements, opens a PR referencing the issue, and
#   moves the card to "In review" for the user to review.
#
# Runs on EITHER agent -- see docs/AUTOMATION-ARCHITECTURE.md, "Agent switch".
# Codex is the default; pick per run with the `agent` input, or repo-wide with the
# `ROSETTA_CI_AGENT` repository variable.
#
# Required GitHub Secrets:
#   - BIFROST_HOST_NAME: Bifrost gateway hostname (no protocol/port/path). Routes
#     Anthropic API calls (Claude branch, `/anthropic`) and OpenAI Responses API
#     calls (Codex branch, `/openai/v1/responses`) through Bifrost.
#   - BIFROST_API_KEY: Bifrost-issued API key. Used by both branches.
#   - SELF_AUTOMATION_PROJECTS_TOKEN: PAT with org Projects (read/write) plus repo
#     Issues/Pull requests/Contents (read/write) scope. The default GITHUB_TOKEN
#     cannot read or write GitHub Projects v2 items, so this PAT is used for all
#     gh/git operations in this workflow.

on:
  schedule:
    - cron: '30 */3 * * *'
    - cron: '0 3 * * *'
  # Every issue activity type, unfiltered. The payload is ignored: the event is only a
  # doorbell and the job loads the whole board, so this also picks up a card the user
  # moved to Scheduled — board Status changes raise only the organization-scoped
  # projects_v2_item, which a repository workflow cannot subscribe to.
  issues:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Coding agent to run'
        type: choice
        options:
          - codex
          - claude
        default: codex

jobs:
  # ── Orchestrator ─────────────────────────────────────────────────────────────
  load-stories:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.impl_matrix }}
      has_work: ${{ steps.load.outputs.has_impl }}
      count: ${{ steps.load.outputs.impl_count }}
      project_id: ${{ steps.load.outputs.project_id }}
      status_field_id: ${{ steps.load.outputs.status_field_id }}
      status_option_ids: ${{ steps.load.outputs.status_option_ids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Issue events plus a 3-hourly schedule means runs can overlap, and the claim is
      # not atomic — two runs could read the same card as Scheduled before either claims
      # it and both would open a branch. Bail out instead: safe, because the in-flight run
      # or the next event picks the work up. Preferred over a `concurrency:` group, which
      # would either queue runs or cancel one mid-flight, stranding its card In progress.
      - name: Skip if another run is already in progress
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          others=$(gh run list --workflow repo-implement.yml --status in_progress \
                     --limit 100 --json databaseId \
                     -q "[.[] | select(.databaseId != ${RUN_ID})] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$others other implementer run(s) in progress — skipping this one."
          fi

      - name: Load board items
        id: load
        if: steps.inflight.outputs.busy != 'true'
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
        run: python .github/scripts/load_stories.py

      - name: Summary
        run: |
          echo "## Implementer — Board Load" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.inflight.outputs.busy }}" = "true" ]; then
            echo "- Skipped: another implementer run is in progress" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Issues to implement: ${{ steps.load.outputs.impl_count }}" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Implementation subagents (parallel, one per issue) ────────────────────────
  implement-story:
    needs: load-stories
    if: needs.load-stories.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # The agent switch. A dispatch input wins; otherwise the repository variable
      # ROSETTA_CI_AGENT; otherwise codex. Every agent-specific step below keys off
      # this one value, so the two branches can never both run.
      ROSETTA_AGENT: ${{ inputs.agent || vars.ROSETTA_CI_AGENT || 'codex' }}
      # Claude-branch only; inert on the Codex branch, which reaches Bifrost through
      # openai/codex-action's Responses API proxy instead of a base-URL env var.
      ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

    strategy:
      matrix: ${{ fromJSON(needs.load-stories.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The push credential is set explicitly in "Configure git" below; without
          # this, checkout also leaves a GITHUB_TOKEN in .git/config and which of the
          # two authenticates a push is undefined.
          persist-credentials: false

      - name: Install Bun
        if: env.ROSETTA_AGENT == 'claude'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          token: ${{ github.token }}

      # Codex has no `plugins:` input and no `--allowedTools`; both are arranged here.
      # The plugin lands as untracked files at the workspace root, so the setup step
      # also adds them to .git/info/exclude -- this is the one pipeline that commits
      # from the working tree, and the agent must not commit the plugin with the story.
      - name: Set up Codex
        if: env.ROSETTA_AGENT == 'codex'
        id: codex
        uses: ./.github/actions/codex-setup
        with:
          github-token: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}@github.com/${{ github.repository }}

      # An issue event fires while the issue is still being edited, so wait until it has
      # been quiet for 5 minutes before claiming it — otherwise the agent implements a
      # plan still being revised. Only issue events need this: a schedule fires on its
      # own clock, and manual dispatch means the user picked the moment.
      # (This is the runner's own shell; the agent-side sleep restrictions do not apply.)
      - name: Debounce — wait for the issue to settle
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ISSUE: ${{ matrix.issue_number }}
        run: |
          previous=""
          for attempt in $(seq 1 6); do
            current=$(gh issue view "$ISSUE" --json updatedAt -q .updatedAt)
            if [ "$current" = "$previous" ]; then
              echo "Issue #$ISSUE unchanged for 5 minutes (last update $current) — proceeding."
              exit 0
            fi
            echo "Issue #$ISSUE updated at $current — waiting 5 minutes (attempt $attempt/6)."
            previous="$current"
            sleep 300
          done
          echo "::warning::Issue #$ISSUE still changing after 30 minutes — proceeding anyway."

      # Claiming needs no judgement, so it is done here rather than costing an agent
      # turn. jq -e fails the step if the board has no "In progress" option, instead
      # of letting the agent run against a lane that does not exist.
      - name: Claim — move card to In progress
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ITEM_ID: ${{ matrix.item_id }}
          ISSUE: ${{ matrix.issue_number }}
          PROJECT_ID: ${{ needs.load-stories.outputs.project_id }}
          FIELD_ID: ${{ needs.load-stories.outputs.status_field_id }}
          OPTION_IDS: ${{ needs.load-stories.outputs.status_option_ids }}
        run: |
          option_id=$(printf '%s' "$OPTION_IDS" | jq -er '."In progress"')
          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_ID" --single-select-option-id "$option_id"
          gh issue comment "$ISSUE" --body "🤖 Implementation started by AI agent."

      - name: Implement — issue #${{ matrix.issue_number }}
        if: env.ROSETTA_AGENT == 'claude'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.BIFROST_API_KEY }}
          github_token: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: |
            https://github.com/griddynamics/rosetta.git
          plugins: |
            rosetta@rosetta
          prompt: |
            Issue: #${{ matrix.issue_number }} — ${{ matrix.issue_title }}
            Project item ID: ${{ matrix.item_id }}
            Project ID: ${{ needs.load-stories.outputs.project_id }}
            Status field ID: ${{ needs.load-stories.outputs.status_field_id }}
            Status option IDs (JSON, name -> id): ${{ needs.load-stories.outputs.status_option_ids }}

            MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-implement-code.md
          show_full_output: false
          claude_args: |
            --allowedTools
            "Read,Write,Edit,MultiEdit,Glob,Grep,Agent,Skill,Bash(*)"
            --disallowedTools "ScheduleWakeup,Bash(* --show-token),Bash(* --show-token*)"
            --model sonnet
            --effort medium

      # Codex counterpart of the step above.
      #
      # `rosetta-workspace-net` is the widest of the three Rosetta profiles -- writes
      # anywhere in the workspace (including `.git`, so the agent can commit), network
      # for `gh` and `git push`, `/proc` and `/etc` denied. That is the intended
      # counterpart of the Claude branch's `Bash(*)`: this pipeline builds and pushes,
      # so a narrow sandbox cannot do the job on either agent. `safety-strategy`
      # stays at the action's `drop-sudo` default, which revokes the runner's sudo
      # before Codex starts -- a protection the Claude branch does not have.
      #
      # Subagents: the Codex plugin does fan out (observed on repo-analysis run
      # 33664134418 -- four parallel subagents). Unverified for this pipeline.
      - name: Implement (Codex) — issue #${{ matrix.issue_number }}
        if: env.ROSETTA_AGENT == 'codex'
      # Pinned to v1.11 deliberately. `@v1` resolves to v1.12, which introduced BOTH
      # of the failures seen here: #160 (drop-sudo chmods /run sockets to 0700, killing
      # systemd-resolved, so the runner loses DNS and dies 52-65 minutes in -- every
      # long Codex run in this repo did exactly that) and #150 (the Linux run never
      # returns after the turn completes). `restrictRootServiceSocket` is absent from
      # src/dropSudo.ts in v1.11 and earlier. Pinning keeps `safety-strategy` at its
      # secure `drop-sudo` default rather than trading the sudo revocation away.
      # Revisit when both are fixed upstream; v1.11 accepts every input used here.
        uses: openai/codex-action@v1.11
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          # `rosetta-workspace-net` grants write to the workspace and nothing else, so
          # every tool that caches outside it fails with EROFS. On run 33683672006 npm
          # hit `EROFS: read-only file system, open '/home/runner/.npm/_cacache/tmp/...'`
          # and the agent improvised `npm_config_cache=/tmp/...` mid-run to get past it.
          # It worked, but the same install also emitted TAR_ENTRY_ERROR warnings, so
          # the recovery is not clean -- and a build the agent has to rescue by hand is
          # a build whose test results cannot be trusted. Point the cache somewhere
          # writable up front instead of leaving it to improvisation.
          npm_config_cache: /tmp/rosetta-npm-cache
          # Same class of failure: the runner's step-summary file is outside the
          # workspace, so anything writing $GITHUB_STEP_SUMMARY inside the agent's
          # sandbox errors. Redirect it rather than have tools fail on a side effect
          # nobody reads -- the job's own summary steps run outside this sandbox.
          GITHUB_STEP_SUMMARY: /tmp/rosetta-agent-step-summary
        with:
          openai-api-key: ${{ secrets.BIFROST_API_KEY }}
          # Uncomment to pin the CLI if a floating `latest` ever regresses the beta
          # permission profiles (they need >= 0.138.0). This is the rollback lever.
          # codex-version: "0.142.2"
          responses-api-endpoint: https://${{ secrets.BIFROST_HOST_NAME }}/openai/v1/responses
          codex-home: ${{ steps.codex.outputs.codex-home }}
          permission-profile: rosetta-workspace-net
          # Mirrors the Claude branch's `--model sonnet --effort medium`. The tier ladder is
          # the one instructions/r3/core/agents/*.md already pairs, position by position:
          # opus<->gpt-5.6-sol, sonnet<->gpt-5.6-terra, haiku<->gpt-5.6-luna. Effort is a
          # separate axis on Codex, so the `-medium` suffix form collapses to model+effort.
          model: gpt-5.6-terra
          effort: medium
          output-file: ${{ runner.temp }}/codex-final-message.md
          prompt: |
            Issue: #${{ matrix.issue_number }} — ${{ matrix.issue_title }}
            Project item ID: ${{ matrix.item_id }}
            Project ID: ${{ needs.load-stories.outputs.project_id }}
            Status field ID: ${{ needs.load-stories.outputs.status_field_id }}
            Status option IDs (JSON, name -> id): ${{ needs.load-stories.outputs.status_option_ids }}

            Environment: `.agents/`, `.codex/`, and `.codex-plugin/` hold the Rosetta instruction
            set -- tooling CI extracted into this workspace, not repository content. Read those
            paths from the working tree (`cat`, `sed`); never through git (`git show`, `git log`,
            `git diff`).

            MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-implement-code.md

      # `openai/codex-action` leaves its responses proxy and `codex exec` tree running
      # after the step reports success, and a runner cannot finalise a job while those
      # hold the step's output pipe. Every Codex run that did real work hung because of
      # it -- triage was cancelled at the job cap, analysis sat until GitHub declared
      # the runner lost at ~62 minutes. See .github/scripts/reap_agent_processes.sh.
      - name: Reap leftover agent processes
        if: always()
        run: .github/scripts/reap_agent_processes.sh

      # The trace is a full tool transcript published as a downloadable artifact,
      # outside Actions log masking. Redact credentials before it leaves the runner.
      # This is the pipeline that puts a PAT in the git remote URL, so the scrub matters
      # most here. Both branches are named: the one that did not run has no files.
      - name: Scrub credentials from execution trace
        if: always()
        env:
          SCRUB_VALUES: |
            ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
            ${{ secrets.BIFROST_API_KEY }}
        run: |
          python3 .github/scripts/scrub_trace.py \
            /home/runner/work/_temp/claude-execution-output.json \
            "${{ steps.codex.outputs.sessions-dir }}"

      - name: Upload Claude execution trace
        if: always() && env.ROSETTA_AGENT == 'claude'
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-trace-${{ matrix.issue_number }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 3

      - name: Upload Codex execution trace
        if: always() && env.ROSETTA_AGENT == 'codex'
        uses: actions/upload-artifact@v6
        with:
          name: codex-execution-trace-${{ matrix.issue_number }}
          path: ${{ steps.codex.outputs.sessions-dir }}
          retention-days: 3
          if-no-files-found: warn

      # claude-code-action decides success from `subtype`/`is_error` alone, so a run
      # that abandons its subagents and changes nothing is indistinguishable from a
      # clean one. This inspects the trace and fails the job instead.
      - name: Verify the run did real work
        if: always() && env.ROSETTA_AGENT == 'claude'
        run: python3 .github/scripts/check_trace.py /home/runner/work/_temp/claude-execution-output.json

      # Codex equivalent, minus the abandoned-subagent check, which has no Codex
      # analogue -- see check_codex_trace.py.
      - name: Verify the run did real work (Codex)
        if: always() && env.ROSETTA_AGENT == 'codex'
        run: python3 .github/scripts/check_codex_trace.py "${{ steps.codex.outputs.sessions-dir }}"

      # The card stays in the In progress lane, which no pipeline loads, so a failed
      # run waits for a human instead of being retried. Say so on the issue.
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SELF_AUTOMATION_PROJECTS_TOKEN }}
          ISSUE: ${{ matrix.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ Implementation run failed — see [the run log]($RUN_URL).

          The card is left at \`In progress\`, which no pipeline picks up, so it will not be retried automatically. Move it back to \`Scheduled\` to retry, or to \`Backlog\` to re-plan first."
