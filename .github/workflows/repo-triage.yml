name: Rosetta GitHub Triage

# Event-driven workflow triggered by PR and issue activity.
# Reviews PRs and issues, adds labels, posts triage comments,
# and handles /rosetta slash commands in comments.
#
# Runs on EITHER agent -- see docs/AUTOMATION-ARCHITECTURE.md, "Agent switch".
# This workflow has no workflow_dispatch trigger, so the agent is chosen only by the
# `ROSETTA_CI_AGENT` repository variable, defaulting to codex.
#
# Required GitHub Secrets:
#   - BIFROST_HOST_NAME: Bifrost gateway hostname (no protocol/port/path). Routes
#     Anthropic API calls (Claude branch, `/anthropic`) and OpenAI Responses API
#     calls (Codex branch, `/openai/v1/responses`) through Bifrost.
#   - BIFROST_API_KEY: Bifrost-issued API key. Used by both branches.

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Read-only, for reporting on CodeQL / Dependabot / CI findings. Alert
      # bodies are NOT public on a public repo, so the prompt forbids quoting
      # their details into a comment -- see repo-triage.md.
      security-events: read
      checks: read
      actions: read
    env:
      # The agent switch. No dispatch trigger here, so this is the repository variable
      # ROSETTA_CI_AGENT, defaulting to codex. Every agent-specific step keys off this
      # one value, so the two branches can never both run.
      ROSETTA_AGENT: ${{ vars.ROSETTA_CI_AGENT || 'codex' }}
      # Claude-branch only; inert on the Codex branch, which reaches Bifrost through
      # openai/codex-action's Responses API proxy instead of a base-URL env var.
      ANTHROPIC_BASE_URL: https://${{ secrets.BIFROST_HOST_NAME }}/anthropic
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    if: |
      !(github.event_name == 'pull_request_target' && (github.event.pull_request.draft == true || contains(github.event.pull_request.title, 'WIP') || contains(github.event.pull_request.title, '[WIP]'))) &&
      !(github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/rosetta')) &&
      !(github.event_name == 'pull_request_review_comment' && !contains(github.event.comment.body, '/rosetta'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      # Fork content lands in pr/ as data the agent READS -- nothing here builds,
      # installs or executes from that tree, and the allowlist below grants only
      # Read plus read-only git subcommands over it. That is why opting out of the
      # checkout guardrail is safe; persist-credentials must stay off so the base
      # repo's GITHUB_TOKEN is never written into pr/.git/config where the agent,
      # if a fork's content ever prompt-injects it, could read it back out.
      - name: Checkout PR content
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install Bun
        if: env.ROSETTA_AGENT == 'claude'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
          token: ${{ github.token }}

      # Codex has no `plugins:` input and no `--allowedTools`; both are arranged here.
      # Safe under pull_request_target because the base repo is checked out at `ref: main`
      # above, so this local action is trusted code, never the fork's.
      - name: Set up Codex
        if: env.ROSETTA_AGENT == 'codex'
        id: codex
        uses: ./.github/actions/codex-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # allowed_non_write_users bypasses claude-code-action's own actor-permission
      # gate, which otherwise hard-fails the whole job for any PR/issue/comment
      # from a non-collaborator -- i.e. every external contributor, which is
      # exactly who triage exists to greet. "*" (not a named allow-list) is
      # required because the point is unknown first-time contributors, not a
      # known set of people. This is a deliberate, bounded tradeoff: it widens
      # who can *trigger* a run, but grants no new capability once triggered --
      # the GITHUB_TOKEN permissions above and the --allowedTools/--disallowedTools
      # allowlist below are unchanged, so the worst case is a spammy/misleading
      # gh comment or issue (still subject to the prompt-injection guardrail in
      # repo-triage.md), or run-triggering cost abuse -- never code execution,
      # `contents: write`, or secret exposure.
      - name: Triage
        if: env.ROSETTA_AGENT == 'claude'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          allowed_non_write_users: "*"
          anthropic_api_key: ${{ secrets.BIFROST_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: |
            https://github.com/griddynamics/rosetta.git
          plugins: |
            rosetta@rosetta
          prompt: |
            Event: ${{ github.event_name }}
            Action: ${{ github.event.action }}
            Repository: ${{ github.repository }}
            PR Number: ${{ github.event.pull_request.number }}
            PR URL: ${{ github.event.pull_request.html_url }}
            PR Content Path: ${{ github.event_name == 'pull_request_target' && 'pr' || '' }}
            Issue Number: ${{ github.event.issue.number }}
            Issue URL: ${{ github.event.issue.html_url }}
            Comment ID: ${{ github.event.comment.id }}
            Comment URL: ${{ github.event.comment.html_url }}

            MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-triage.md
          show_full_output: false
          # Read/Glob/Grep are scoped to github.workspace (which contains both the
          # base checkout and pr/) rather than left bare: Claude Code's permission
          # matcher applies no implicit cwd sandbox to an unscoped tool grant, so
          # bare "Read" would let a prompt-injected instruction read anywhere the
          # runner user can, e.g. /proc/self/environ -- where ANTHROPIC_API_KEY and
          # GITHUB_TOKEN sit unstripped in this process's own environment. The
          # explicit /proc and /etc denies in disallowedTools are redundant with
          # that scoping (deny wins regardless of specificity) but kept as a second
          # layer in case the allow scope is ever loosened by mistake.
          claude_args: |
            --allowedTools
            "Read(/${{ github.workspace }}/**),Glob(/${{ github.workspace }}/**),Grep(/${{ github.workspace }}/**),Agent,Skill,Bash(gh * list*),Bash(gh * status*),Bash(gh --version),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git show*),Bash(git branch*),Bash(git ls-files*),Bash(git rev-parse*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr edit*),Bash(gh pr comment*),Bash(gh issue view*),Bash(gh issue edit*),Bash(gh issue comment*),Bash(gh issue create*),Bash(gh api repos/*/issues/*),Bash(gh api repos/*/pulls/*),Bash(gh api repos/*/contents/*),Bash(gh api repos/*/git/*),Bash(gh api repos/*/tags*),Bash(gh api repos/*/code-scanning/alerts*),Bash(gh api repos/*/code-scanning/analyses*),Bash(gh api repos/*/dependabot/alerts*),Bash(gh api repos/*/commits/*),Bash(gh api repos/*/actions/runs*),Bash(gh api repos/*/labels*),Bash(gh pr checks*),Bash(git -C * status*),Bash(git -C * diff*),Bash(git -C * log*),Bash(git -C * show*),Bash(git -C * branch*),Bash(git -C * ls-files*),Bash(git -C * rev-parse*)"
            --disallowedTools
            "ScheduleWakeup,Read(//proc/**),Read(//etc/**),Glob(//proc/**),Glob(//etc/**),Grep(//proc/**),Grep(//etc/**),Bash(* --show-token),Bash(* --show-token*),Bash(gh api * -X*),Bash(gh api * --method*),Bash(gh api * -f*),Bash(gh api * -F*),Bash(gh api * --field*),Bash(gh api * --raw-field*),Bash(gh api * --input*)"
            --model sonnet
            --effort high

      # Codex counterpart of the step above. `allow-users: "*"` is the same deliberate,
      # bounded tradeoff as `allowed_non_write_users` on the Claude branch, for the same
      # reason -- see the comment there.
      #
      # SECURITY DELTA, stated plainly because this is the workflow that reads untrusted
      # fork content. What bounds a Codex triage run:
      #   - the `rosetta-read-net` permission profile: read-only filesystem, so nothing
      #     in the checkout or in `pr/` can be modified, with `/proc` and `/etc` denied
      #     -- the same reads the Claude branch's disallowedTools blocks;
      #   - the enforced execpolicy deny-list at /etc/codex/requirements.toml, written by
      #     the setup step: no `gh auth`, no secrets, no egress outside gh/git, no
      #     merge/close/review, no destructive repo/board/label operations. This is the
      #     counterpart of `--disallowedTools`, and it cannot be relaxed by codex-args,
      #     project config, or the model, because the strictest layer wins;
      #   - the job's GITHUB_TOKEN permissions block above, unchanged;
      #   - `safety-strategy: drop-sudo` (the action's default), which revokes the
      #     runner's sudo before Codex starts -- a protection the Claude branch lacks.
      #     It is kept precisely because this pipeline is the one ANY GitHub user can
      #     trigger, on content they wrote; see the version pin below for why keeping
      #     it no longer costs us the runner.
      #
      # What genuinely has NO counterpart -- exactly two things:
      #   1. Allow-list semantics. execpolicy is structurally a deny-list: an unmatched
      #      command yields no decision, and the strictest match wins, so "forbid all,
      #      then permit these" is unexpressible. `--allowedTools` cannot be ported. So
      #      a `gh` subcommand that is neither needed nor explicitly forbidden (e.g.
      #      `gh gist create`) runs on Codex and would be refused on Claude.
      #   2. `gh api <endpoint> -X POST`. Pattern tokens are `token` or `any_of` with no
      #      wildcard, and matching is prefix-only, so a flag that follows the endpoint
      #      argument cannot be matched. The Claude branch's `Bash(gh api * -X*)` denies
      #      have no exact equivalent; a rule covering only the flag-first form would be
      #      worse than none, so none is written.
      # Both are bounded by this job's GITHUB_TOKEN: worst case is a misleading comment,
      # label or gist. Not code execution, not `contents: write`, and not secret exposure
      # -- the Bifrost key never enters the Codex process, because openai/codex-action
      # pipes it into a separate proxy process instead of the agent's environment.
      # See docs/AUTOMATION-ARCHITECTURE.md, "Command policy".
      - name: Triage (Codex)
        if: env.ROSETTA_AGENT == 'codex'
      # Pinned to v1.11 deliberately. `@v1` resolves to v1.12, which introduced BOTH
      # of the failures seen here: #160 (drop-sudo chmods /run sockets to 0700, killing
      # systemd-resolved, so the runner loses DNS and dies 52-65 minutes in -- every
      # long Codex run in this repo did exactly that) and #150 (the Linux run never
      # returns after the turn completes). `restrictRootServiceSocket` is absent from
      # src/dropSudo.ts in v1.11 and earlier. Pinning keeps `safety-strategy` at its
      # secure `drop-sudo` default rather than trading the sudo revocation away.
      # Revisit when both are fixed upstream; v1.11 accepts every input used here.
        uses: openai/codex-action@v1.11
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allow-users: "*"
          allow-bots: "true"
          openai-api-key: ${{ secrets.BIFROST_API_KEY }}
          # Uncomment to pin the CLI if a floating `latest` ever regresses the beta
          # permission profiles (they need >= 0.138.0). This is the rollback lever.
          # codex-version: "0.142.2"
          responses-api-endpoint: https://${{ secrets.BIFROST_HOST_NAME }}/openai/v1/responses
          codex-home: ${{ steps.codex.outputs.codex-home }}
          permission-profile: rosetta-read-net
          # Mirrors the Claude branch's `--model sonnet --effort high`. The tier ladder is
          # the one instructions/r3/core/agents/*.md already pairs, position by position:
          # opus<->gpt-5.6-sol, sonnet<->gpt-5.6-terra, haiku<->gpt-5.6-luna. Effort is a
          # separate axis on Codex, so the `-high` suffix form collapses to model+effort.
          model: gpt-5.6-terra
          effort: high
          output-file: ${{ runner.temp }}/codex-final-message.md
          prompt: |
            Event: ${{ github.event_name }}
            Action: ${{ github.event.action }}
            Repository: ${{ github.repository }}
            PR Number: ${{ github.event.pull_request.number }}
            PR URL: ${{ github.event.pull_request.html_url }}
            PR Content Path: ${{ github.event_name == 'pull_request_target' && 'pr' || '' }}
            Issue Number: ${{ github.event.issue.number }}
            Issue URL: ${{ github.event.issue.html_url }}
            Comment ID: ${{ github.event.comment.id }}
            Comment URL: ${{ github.event.comment.html_url }}

            Environment: `.agents/`, `.codex/`, and `.codex-plugin/` hold the Rosetta instruction
            set -- tooling CI extracted into this workspace, not repository content. Read those
            paths from the working tree (`cat`, `sed`); never through git (`git show`, `git log`,
            `git diff`).

            MUST APPLY AND FULLY EXECUTE FULLY AUTONOMOUSLY WITHOUT ANY USER INTERACTION OR QUESTIONS, No HITL: .github/prompts/repo-triage.md

      # `openai/codex-action` leaves its responses proxy and `codex exec` tree running
      # after the step reports success, and a runner cannot finalise a job while those
      # hold the step's output pipe. Every Codex run that did real work hung because of
      # it -- triage was cancelled at the job cap, analysis sat until GitHub declared
      # the runner lost at ~62 minutes. See .github/scripts/reap_agent_processes.sh.
      - name: Reap leftover agent processes
        if: always()
        run: .github/scripts/reap_agent_processes.sh

      # The trace is a full tool transcript published as a downloadable artifact,
      # outside Actions log masking. Redact credentials before it leaves the runner.
      # Both branches are named: the one that did not run has no files and is a no-op.
      - name: Scrub credentials from execution trace
        if: always()
        env:
          SCRUB_VALUES: |
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.BIFROST_API_KEY }}
        run: |
          python3 .github/scripts/scrub_trace.py \
            /home/runner/work/_temp/claude-execution-output.json \
            "${{ steps.codex.outputs.sessions-dir }}"

      # Triage is event-driven, so a run that finds nothing to say is legitimate:
      # --allow-no-op keeps the abandoned-subagent check and drops the did-it-mutate one.
      - name: Verify the run did real work
        if: always() && env.ROSETTA_AGENT == 'claude'
        run: python3 .github/scripts/check_trace.py /home/runner/work/_temp/claude-execution-output.json --allow-no-op

      # Codex has no subagents, so with --allow-no-op this check has nothing left to
      # assert. It runs anyway for its one remaining job: failing the run when no
      # rollout exists at all, i.e. the agent step never really started.
      - name: Verify the run did real work (Codex)
        if: always() && env.ROSETTA_AGENT == 'codex'
        run: python3 .github/scripts/check_codex_trace.py "${{ steps.codex.outputs.sessions-dir }}" --allow-no-op

      - name: Upload Claude execution trace
        if: always() && env.ROSETTA_AGENT == 'claude'
        uses: actions/upload-artifact@v6
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 3

      - name: Upload Codex execution trace
        if: always() && env.ROSETTA_AGENT == 'codex'
        uses: actions/upload-artifact@v6
        with:
          name: codex-execution-output
          path: ${{ steps.codex.outputs.sessions-dir }}
          retention-days: 3
          if-no-files-found: warn
