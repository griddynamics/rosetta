name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/web/**"
      - "llms-full.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Builds with the site's own Gemfile (Jekyll 4.x) instead of actions/jekyll-build-pages
      # (github-pages gem, Jekyll 3.10) so CI and local `bundle exec jekyll serve` use one engine.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: docs/web

      - name: Stage llms-full.txt for site
        run: cp llms-full.txt docs/web/llms-full.txt

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        working-directory: docs/web
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
