name: Publish Rosetta MCP Helm chart

on:
  push:
    branches:
      - main
    paths: &chart_paths
      - 'src/helm-charts/rosetta-mcp-server/**'
      - '.github/workflows/publish-mcp-helm-chart.yml'
  pull_request:
    paths: *chart_paths

  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      # Cancel superseded PR validations only. On a push to main, cancelling this job
      # skips `publish` (needs: validate), so a chart version bumped by that push would
      # never reach the registry — two chart pushes in quick succession would drop the
      # first version from the series entirely.
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.20.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.6.3

      - name: Assert chart appVersion matches rosetta-mcp-server version
        run: |
          set -euo pipefail
          CHART_PATH=./src/helm-charts/rosetta-mcp-server
          SERVER_PYPROJECT=./src/rosetta-mcp-server/pyproject.toml
          APP_VERSION="$(grep -E '^appVersion:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          SERVER_VERSION="$(grep -E '^version = ' "${SERVER_PYPROJECT}" | head -1 | sed 's/version = "\(.*\)"/\1/')"
          echo "Chart appVersion:           ${APP_VERSION}"
          echo "rosetta-mcp-server version: ${SERVER_VERSION}"
          if [ "${APP_VERSION}" != "${SERVER_VERSION}" ]; then
            echo "::error::Chart.yaml appVersion (${APP_VERSION}) does not match src/rosetta-mcp-server/pyproject.toml version (${SERVER_VERSION}). values.yaml defaults image.tag to .Chart.AppVersion, so a default install would pull the wrong image. Bump Chart.yaml appVersion (and the chart version) - scripts/bump_versions.sh does both."
            exit 1
          fi
          echo "appVersion is in sync."

      - name: Lint, template, and unit test chart
        run: |
          CHART_PATH=./src/helm-charts/rosetta-mcp-server
          helm lint "$CHART_PATH"
          helm template helm-test "$CHART_PATH" >/dev/null
          helm unittest "$CHART_PATH"

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mcp-helm-chart-main
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.20.2

      - name: Refuse overwrite of existing chart version
        run: |
          set -euo pipefail
          VER=$(grep -E "^version:" Chart.yaml | head -1 | awk "{print \$2}")
          echo "Chart version is ${VER}"
          # Best-effort: if the OCI tag already resolves, abort instead of overwriting.
          if helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/$(basename $(pwd)) --version "${VER}" --destination /tmp/helm-check 2>/dev/null; then
            echo "::error::version ${VER} already published"
            exit 1
          fi
      - name: Package and push Helm chart (OCI / Docker Hub)
        run: |
          set -euo pipefail
          CHART_PATH=./src/helm-charts/rosetta-mcp-server
          VERSION="$(grep -E '^version:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          CHART_NAME="$(grep -E '^name:' "${CHART_PATH}/Chart.yaml" | awk '{print $2}' | tr -d '"')"
          REPOSITORY="registry-1.docker.io/griddynamics"
          echo "Package version: ${VERSION}"
          echo "Chart name: ${CHART_NAME}"
          echo "OCI registry prefix: oci://${REPOSITORY}"
          helm package "$CHART_PATH" --version "${VERSION}"
          PKG="${CHART_NAME}-${VERSION}.tgz"
          echo "${{ secrets.DOCKERHUB_OAT }}" | helm registry login registry-1.docker.io \
            -u "${{ secrets.DOCKERHUB_LOGIN }}" \
            --password-stdin
          helm push "./${PKG}" "oci://${REPOSITORY}"
